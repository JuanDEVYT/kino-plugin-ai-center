<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20"/>
      <stop offset="50%" stop-color="#1A153A"/>
      <stop offset="100%" stop-color="#090714"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.4"/>

  <!-- Orbital Rings -->
  <ellipse cx="256" cy="256" rx="170" ry="65" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.75" transform="rotate(-30 256 256)" stroke-dasharray="16 10 32 10"/>
  <ellipse cx="256" cy="256" rx="170" ry="65" fill="none" stroke="url(#coreGrad)" stroke-width="6" opacity="0.75" transform="rotate(30 256 256)" stroke-dasharray="24 12 8 12"/>

  <!-- Neural Sparks -->
  <circle cx="120" cy="190" r="8" fill="#00F2FE" filter="url(#glow)"/>
  <circle cx="392" cy="322" r="8" fill="#FF007F" filter="url(#glow)"/>
  <circle cx="370" cy="170" r="6" fill="#4FACFE"/>
  <circle cx="142" cy="342" r="6" fill="#7F00FF"/>

  <!-- Glowing Core -->
  <circle cx="256" cy="256" r="80" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="64" fill="#FFFFFF" opacity="0.15"/>

  <!-- AI Center Icon Glyph (Stylized Brain / Spark Prism) -->
  <path d="M256 195 L275 238 L320 256 L275 274 L256 317 L237 274 L192 256 L237 238 Z" fill="#FFFFFF"/>
</svg>